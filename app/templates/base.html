<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sole{% endblock %} - Personal Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <meta name="htmx-config" content='{"defaultSwapStyle":"innerHTML"}'>
    <meta name="csrf-token" content="{{ csrf_token() }}">
</head>
<body>
    <script>
        // Send CSRF token with every HTMX request
        document.addEventListener('htmx:configRequest', function(evt) {
            evt.detail.headers['X-CSRFToken'] = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
        });
    </script>
    <div class="app-layout">
        {% include 'partials/sidebar.html' %}

        <div class="main-content">
            {% block header %}{% endblock %}

            {% include 'partials/flash_messages.html' %}

            {% block content %}{% endblock %}
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
